# Fast incident-workflow pipeline. The complete pipeline is preserved in
# .gitlab-ci.yml.original and can be restored after live validation.

stages: [test, publish]

variables:
  IMG_PREFIX: "ghcr.io/ama2352/vroom-mvp"
  VERSION: "1.0.0"
  DOCKER_BUILDKIT: "1"
  GIT_DEPTH: "1"

.go_consumer_test:
  stage: test
  image: golang:1.25-alpine
  script:
    - cd "$SERVICE_PATH"
    - go test ./internal/telemetry ./internal/worker -v

test-dispatch-correlation:
  extends: .go_consumer_test
  variables: { SERVICE_PATH: services/dispatch }

test-notification-correlation:
  extends: .go_consumer_test
  variables: { SERVICE_PATH: services/notification }

test-ride:
  stage: test
  image: golang:1.25-alpine
  script:
    - cd services/ride
    - go test ./...

test-incident-agent:
  stage: test
  image: python:3.12-slim
  script:
    - cd incident-diagnosis/agent
    - python -m pip install -r requirements.txt -r requirements-test.txt
    - python -m pytest tests/test_alerting.py tests/test_collector.py tests/test_confidence.py tests/test_correlation.py tests/test_app.py tests/test_memory.py -q

test-kubectl-executor:
  stage: test
  image: python:3.12-slim
  script:
    - cd incident-diagnosis/kubectl-executor
    - python -m pip install --root-user-action=ignore -r requirements.txt "pytest>=8,<10"
    - python -m pytest tests/test_named_tools.py -q

test-n8n-sources:
  stage: test
  image: node:22-alpine
  script:
    - node --test incident-diagnosis/n8n/tests/code-nodes.test.mjs

test-dashboard-build:
  stage: test
  image: node:22-alpine
  script:
    - cd incident-diagnosis/dashboard
    - npm ci
    - npm run typecheck
    - npm run build

.build_push_target:
  stage: publish
  image: docker:24.0.5
  before_script:
    - docker login ghcr.io -u "$GHCR_USER" -p "$GHCR_TOKEN"
  script:
    - export IMAGE="$IMG_PREFIX-$SERVICE_NAME"
    # Keep the pipeline ID as its own numeric SemVer prerelease identifier.
    # The `z` prefix makes this new series sort above legacy `build.52-<sha>` tags.
    - export IMAGE_TAG="v${VERSION}-build.z.${CI_PIPELINE_IID}.${CI_COMMIT_SHORT_SHA}"
    - cd "$SERVICE_PATH"
    - docker build --build-arg BASE_IMAGE_PREFIX="public.ecr.aws/docker/library/" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$IMAGE_TAG"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
    - docker push "$IMAGE:$IMAGE_TAG"

build-push-dispatch:
  extends: .build_push_target
  variables: { SERVICE_NAME: dispatch-service, SERVICE_PATH: services/dispatch }
  needs: [test-dispatch-correlation]

build-push-notification:
  extends: .build_push_target
  variables: { SERVICE_NAME: notification-service, SERVICE_PATH: services/notification }
  needs: [test-notification-correlation]

build-push-ride:
  extends: .build_push_target
  variables: { SERVICE_NAME: ride-service, SERVICE_PATH: services/ride }
  needs: [test-ride]

build-push-incident-agent:
  extends: .build_push_target
  variables: { SERVICE_NAME: incident-agent, SERVICE_PATH: incident-diagnosis/agent }
  needs: [test-incident-agent, test-n8n-sources]

build-push-kubectl-executor:
  extends: .build_push_target
  variables: { SERVICE_NAME: kubectl-executor, SERVICE_PATH: incident-diagnosis/kubectl-executor }
  needs: [test-kubectl-executor]

build-push-incident-dashboard:
  extends: .build_push_target
  variables: { SERVICE_NAME: incident-dashboard, SERVICE_PATH: incident-diagnosis/dashboard }
  needs: [test-dashboard-build]
