# Fast image pipeline. The complete test pipeline is preserved in
# .gitlab-ci.yml.original and can be restored when validation is needed.

stages: [publish]

variables:
  IMG_PREFIX: "ghcr.io/ama2352/vroom-mvp"
  VERSION: "1.0.0"
  DOCKER_BUILDKIT: "1"
  GIT_DEPTH: "1"

.build_push_target:
  stage: publish
  image: docker:24.0.5
  before_script:
    - docker login ghcr.io -u "$GHCR_USER" -p "$GHCR_TOKEN"
  script:
    - export IMAGE="$IMG_PREFIX-$SERVICE_NAME"
    # Keep the pipeline ID as its own numeric SemVer prerelease identifier.
    # The `z` prefix makes this new series sort above legacy `build.52-<sha>` tags.
    - export IMAGE_TAG="v${VERSION}-build.z.${CI_PIPELINE_IID}.${CI_COMMIT_SHORT_SHA}"
    - cd "$SERVICE_PATH"
    - docker build --build-arg BASE_IMAGE_PREFIX="public.ecr.aws/docker/library/" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$IMAGE_TAG"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
    - docker push "$IMAGE:$IMAGE_TAG"

build-push-dispatch:
  extends: .build_push_target
  variables: { SERVICE_NAME: dispatch-service, SERVICE_PATH: services/dispatch }
  rules:
    - changes: [services/dispatch/**/*]

build-push-notification:
  extends: .build_push_target
  variables: { SERVICE_NAME: notification-service, SERVICE_PATH: services/notification }
  rules:
    - changes: [services/notification/**/*]

build-push-ride:
  extends: .build_push_target
  variables: { SERVICE_NAME: ride-service, SERVICE_PATH: services/ride }
  rules:
    - changes: [services/ride/**/*]

build-push-incident-agent:
  extends: .build_push_target
  variables: { SERVICE_NAME: incident-agent, SERVICE_PATH: incident-diagnosis/agent }
  rules:
    - changes: [incident-diagnosis/agent/**/*]

build-push-kubectl-executor:
  extends: .build_push_target
  variables: { SERVICE_NAME: kubectl-executor, SERVICE_PATH: incident-diagnosis/kubectl-executor }
  rules:
    - changes: [incident-diagnosis/kubectl-executor/**/*]

build-push-incident-dashboard:
  extends: .build_push_target
  variables: { SERVICE_NAME: incident-dashboard, SERVICE_PATH: incident-diagnosis/dashboard }
  rules:
    - changes: [incident-diagnosis/dashboard/**/*]
